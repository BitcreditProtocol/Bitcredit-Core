name: ebill_flutter_ffi
description: "eBills Flutter FFI"
version: 0.6.1
homepage:

environment:
  sdk: ^3.10.1
  # Build hooks (native assets) compile and bundle the Rust library; see
  # hook/build.dart. 3.50.0 is the oldest Flutter this setup was verified with.
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  plugin_platform_interface: ^2.0.2
  freezed_annotation: ^3.1.0
  # Used by hook/build.dart only. Hooks run in the consuming app's build, so
  # these must be regular dependencies, not dev_dependencies.
  code_assets: ^2.2.0
  collection: ^1.19.1
  convert: ^3.1.2
  crypto: ^3.0.6
  ed25519_edwards: ^0.3.1
  flutter_rust_bridge_hooks: 2.13.0
  hooks: ^2.2.0
  http: ^1.6.0
  logging: ^1.3.0
  # 1.1.0 links 64-bit Android libraries for 16 KB pages; flutter_rust_bridge_hooks
  # alone would accept older versions.
  native_toolchain_rust: ^1.1.1
  path: ^1.9.1
  toml: ^0.18.0
  yaml: ^3.1.3

dev_dependencies:
  ffi: ^2.1.3
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^3.2.5
