version: 2
updates:
  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/example"
    groups:
      dart:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 7
    labels:
      - "dependencies"
      - "dart"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    assignees:
      - "zupzup"

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      all-github-actions:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 3
    assignees:
      - "zupzup"

  - package-ecosystem: "cargo"
    directory: "/"
    groups:
      rust:
        update-types:
          - "patch"
          - "minor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 7
    # libc 0.2.190 breaks iOS builds (rust-lang/libc#5601); see the pin in
    # crates/bcr-ebill-flutter-ffi/Cargo.toml.
    ignore:
      - dependency-name: "libc"
        versions: ["0.2.190"]
    labels:
      - "dependencies"
      - "rust"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    assignees:
      - "zupzup"
