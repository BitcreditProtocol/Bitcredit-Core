name: WASM Release

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog (optional)"
        required: false
        default: ""

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  release:
    name: WASM Release and Publish
    timeout-minutes: 25
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    environment: release-wasm

    # Restrict execution to specific users
    if: contains(fromJson('["mtbitcr", "zupzup", "tompro", "cleot"]'), github.actor)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m 1 '^version =' Cargo.toml | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: v$VERSION"

      - name: Ensure tag does not already exist
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Error: Tag v${{ env.VERSION }} already exists!"
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          registry-url: "https://registry.npmjs.org"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable

      - name: Install wasm-pack
        run: |
          cargo install wasm-pack --version 0.14.0

      - name: Build with wasm-pack
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        run: |
          cd crates/bcr-ebill-wasm
          wasm-pack build --target web --scope bitcredit --out-name index

      - name: Copy LICENSE into pkg/
        run: |
          cp LICENSE crates/bcr-ebill-wasm/pkg/

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            ${{ inputs.changelog }}

            **Version:** v${{ env.VERSION }}
          draft: false
          prerelease: false

      - name: Upload WASM artifacts to Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd crates/bcr-ebill-wasm/pkg
          for file in *; do
            if [[ "$file" != ".gitignore" ]]; then
              gh release upload "v${{ env.VERSION }}" "$file"
            fi
          done

      - name: Publish to npm
        run: |
          cd crates/bcr-ebill-wasm/pkg
          npm publish --access public --provenance --tag latest

