name: Release precompiled binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: precompiled-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Flutter's default ndkVersion (FlutterExtension.kt, Flutter 3.44), so
  # precompiled and locally built binaries use the same NDK. Cargokit installs
  # it if the runner doesn't have it.
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  precompile:
    name: Precompile ${{ matrix.target }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    environment: release-precompiled

    # One job per target, all in parallel. Cargokit tolerates the jobs racing
    # to create the shared precompiled_<hash> release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ios, os: macos-latest, target: aarch64-apple-ios }
          - { platform: ios, os: macos-latest, target: aarch64-apple-ios-sim }
          - { platform: ios, os: macos-latest, target: x86_64-apple-ios }
          - { platform: android, os: ubuntu-latest, target: armv7-linux-androideabi }
          - { platform: android, os: ubuntu-latest, target: aarch64-linux-android }
          - { platform: android, os: ubuntu-latest, target: i686-linux-android }
          - { platform: android, os: ubuntu-latest, target: x86_64-linux-android }
          - { platform: macos, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: macos, os: macos-latest, target: x86_64-apple-darwin }
          - { platform: windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { platform: windows, os: windows-11-arm, target: aarch64-pc-windows-msvc }
          # Same Ubuntu as eBill's Linux build, so the binaries need glibc >= 2.39.
          # Never build on a newer Ubuntu than the app, and don't use
          # ubuntu-latest: it would silently raise the glibc requirement.
          - { platform: linux, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { platform: linux, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep /usr/local/lib/android: the Android build needs the SDK and NDK.
      - name: Free up disk space
        if: matrix.platform == 'android'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          docker system prune -a -f
          df -h /

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Activate cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ebill-flutter-ffi-precompiled-${{ matrix.target }}

      - name: Precompile iOS
        if: matrix.platform == 'ios'
        working-directory: cargokit/build_tool
        run: |
          echo "Deployment target: $IPHONEOS_DEPLOYMENT_TARGET"
          rustc --target "$TARGET" --print deployment-target

          dart run build_tool precompile-binaries -v \
            --manifest-dir=../../crates/bcr-ebill-flutter-ffi \
            --repository="$GITHUB_REPOSITORY" \
            --target-commitish="$GITHUB_SHA" \
            --prerelease \
            --target="$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.PRECOMPILED_BINARIES_SIG_PRIVATE_KEY }}
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"

      - name: Precompile Android
        if: matrix.platform == 'android'
        working-directory: cargokit/build_tool
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "NDK Version: $ANDROID_NDK_VERSION"

          dart run build_tool precompile-binaries -v \
            --manifest-dir=../../crates/bcr-ebill-flutter-ffi \
            --repository="$GITHUB_REPOSITORY" \
            --target-commitish="$GITHUB_SHA" \
            --prerelease \
            --android-sdk-location="$android_sdk" \
            --android-ndk-version="$ANDROID_NDK_VERSION" \
            --android-min-sdk-version=27 \
            --target="$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.PRECOMPILED_BINARIES_SIG_PRIVATE_KEY }}

      - name: Precompile desktop
        if: contains(fromJSON('["macos", "windows", "linux"]'), matrix.platform)
        working-directory: cargokit/build_tool
        shell: bash
        run: |
          dart run build_tool precompile-binaries -v \
            --manifest-dir=../../crates/bcr-ebill-flutter-ffi \
            --repository="$GITHUB_REPOSITORY" \
            --target-commitish="$GITHUB_SHA" \
            --prerelease \
            --target="$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.PRECOMPILED_BINARIES_SIG_PRIVATE_KEY }}
          # Flutter's minimum macOS version; matches macos/ebill_flutter_ffi.podspec.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
