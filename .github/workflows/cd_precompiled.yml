name: Release precompiled binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: precompiled-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # The build hook honours CARGO_TARGET_DIR; keep it where rust-cache looks.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Flutter's default ndkVersion (FlutterExtension.kt, Flutter 3.44), so
  # precompiled and locally built binaries use the same NDK. The Android step
  # installs it, since runner images drop older NDKs.
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  precompile:
    name: Precompile ${{ matrix.target }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    environment: release-precompiled

    # One job per target, all in parallel. tool/precompile_binaries.dart
    # tolerates the jobs racing to create the shared precompiled_<hash> release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ios, os: macos-latest, target: aarch64-apple-ios }
          - { platform: ios, os: macos-latest, target: aarch64-apple-ios-sim }
          - { platform: ios, os: macos-latest, target: x86_64-apple-ios }
          - { platform: android, os: ubuntu-latest, target: armv7-linux-androideabi }
          - { platform: android, os: ubuntu-latest, target: aarch64-linux-android }
          - { platform: android, os: ubuntu-latest, target: i686-linux-android }
          - { platform: android, os: ubuntu-latest, target: x86_64-linux-android }
          - { platform: macos, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: macos, os: macos-latest, target: x86_64-apple-darwin }
          - { platform: windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { platform: windows, os: windows-11-arm, target: aarch64-pc-windows-msvc }
          # Same Ubuntu as eBill's Linux build, so the binaries need glibc >= 2.39.
          # Never build on a newer Ubuntu than the app, and don't use
          # ubuntu-latest: it would silently raise the glibc requirement.
          - { platform: linux, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { platform: linux, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Activate cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ebill-flutter-ffi-precompiled-${{ matrix.target }}

      - name: Fetch tool dependencies
        working-directory: tool
        run: dart pub get

      # Each step builds the target with the build hook's own builder
      # (hook/src), signs it and uploads it to the precompiled_<crate hash>
      # release. The Rust toolchain and targets come from
      # crates/bcr-ebill-flutter-ffi/rust-toolchain.toml; the hook sets the
      # iOS/macOS deployment targets and the Android API level.
      - name: Precompile iOS and macOS
        if: contains(fromJSON('["ios", "macos"]'), matrix.platform)
        working-directory: tool
        run: |
          dart run precompile_binaries.dart \
            --repository="$GITHUB_REPOSITORY" \
            --target-commitish="$GITHUB_SHA" \
            --prerelease \
            --target="$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.PRECOMPILED_BINARIES_SIG_PRIVATE_KEY }}

      - name: Precompile Android
        if: matrix.platform == 'android'
        working-directory: tool
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "NDK Version: $ANDROID_NDK_VERSION"
          # Runner images drop older NDKs; a no-op when already present.
          "$android_sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"

          dart run precompile_binaries.dart \
            --repository="$GITHUB_REPOSITORY" \
            --target-commitish="$GITHUB_SHA" \
            --prerelease \
            --android-ndk="$android_sdk/ndk/$ANDROID_NDK_VERSION" \
            --target="$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.PRECOMPILED_BINARIES_SIG_PRIVATE_KEY }}

      - name: Precompile desktop
        if: contains(fromJSON('["windows", "linux"]'), matrix.platform)
        working-directory: tool
        shell: bash
        run: |
          dart run precompile_binaries.dart \
            --repository="$GITHUB_REPOSITORY" \
            --target-commitish="$GITHUB_SHA" \
            --prerelease \
            --target="$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.PRECOMPILED_BINARIES_SIG_PRIVATE_KEY }}
