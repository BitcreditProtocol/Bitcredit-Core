[package]
name = "bcr-ebill-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
default = []
protocol-ws = ["surrealdb/protocol-ws"]
surrealkv = ["surrealdb/kv-surrealkv"]

[dependencies]
borsh.workspace = true
async-trait.workspace = true
base64.workspace = true
serde_json.workspace = true
serde.workspace = true
log.workspace = true
thiserror.workspace = true
uuid.workspace = true
futures.workspace = true
nostr.workspace = true
bcr-ebill-core.workspace = true
bcr-common.workspace = true
time.workspace = true
surrealdb = { workspace = true, default-features = false, features = ["protocol-ws"] }
tokio.workspace = true
bitcoin.workspace = true
url.workspace = true
arc-swap = "1.7"

[dev-dependencies]
nostr_043 = { package = "nostr", version = "=0.43.1" } # for backwards-compat testing
surrealdb = { workspace = true, default-features = false, features = ["kv-mem"] }

