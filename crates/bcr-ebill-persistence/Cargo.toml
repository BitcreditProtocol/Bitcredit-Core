[package]
name = "bcr-ebill-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
default = []
protocol-ws = ["surrealdb/protocol-ws"]
surrealkv = ["surrealdb/kv-surrealkv"]

[dependencies]
borsh.workspace = true
chrono.workspace = true
async-trait.workspace = true
base64.workspace = true
serde_json.workspace = true
serde.workspace = true
log.workspace = true
thiserror.workspace = true
uuid.workspace = true
futures.workspace = true
nostr.workspace = true
bcr-ebill-core.workspace = true
bcr-common.workspace = true
tokio.workspace = true
tokio_with_wasm.workspace = true
bitcoin.workspace = true
url.workspace = true
arc-swap = "1.7"

# Enable "kv-indxdb" only for WebAssembly (wasm32)
[target.'cfg(target_arch = "wasm32")'.dependencies]
surrealdb = { workspace = true, default-features = false, features = ["kv-indxdb"] }

# Native backend is selected through this crate's features
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
surrealdb = {
    workspace = true,
    default-features = false
}

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
surrealdb = {
    workspace = true,
    default-features = false,
    features = ["kv-mem"]
}
